<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2FA Authenticator - 安全验证器</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Application Header -->
    <header class="app-header">
      <div class="brand-logo">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span>2FA Vault</span>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="btn-icon-only" title="切换暗色/亮色主题" aria-label="Toggle Theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <button id="settingsBtn" class="btn-icon-only" style="display: none;" title="设置与修改主密码" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="lockBtn" class="btn-ghost" style="display: none;" title="锁定加密库">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>锁定</span>
        </button>
      </div>
    </header>

    <!-- Lock View -->
    <div id="lockView" class="glass-panel lock-wrapper">
      <div class="lock-shield-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h2 id="lockTitle" class="lock-title">解锁密码库</h2>
      <p id="lockDesc" class="lock-subtitle">输入您的主密码（Master Password）以解密 2FA 动态验证码。</p>
      
      <div class="input-wrapper">
        <input type="password" id="masterPasswordInput" class="input-control" placeholder="输入主密码" autocomplete="current-password" autofocus />
        <button id="togglePwVisibility" class="input-icon-end" type="button" aria-label="Toggle password visibility">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button id="unlockBtn" class="btn-primary" style="width: 100%;">
        <span>解锁验证器</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
      <div id="lockError" style="color: var(--destructive); margin-top: 1rem; font-size: 0.9rem; font-weight: 500; display: none;"></div>
      <div style="text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 2rem;">v1.1.3</div>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboardView" style="display: none;">
      <div class="toolbar">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="input-control" placeholder="搜索账号或服务..." />
          <span class="search-kbd">/</span>
        </div>
        <button id="addAccountBtn" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>添加账号</span>
        </button>
        <label for="qrFileInput" class="btn-ghost" style="cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>扫码识别</span>
        </label>
        <input type="file" id="qrFileInput" accept="image/*" style="display: none;" />
      </div>

      <div id="accountList" class="accounts-grid"></div>
    </div>
  </div>

  <!-- Add Account Modal -->
  <div id="addModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">添加 2FA 验证账号</h3>
        <button id="closeAddModalBtn" class="btn-icon-only" style="border: none; background: transparent;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="input-wrapper">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">服务平台 (Issuer)</label>
        <input type="text" id="addIssuerInput" class="input-control" placeholder="如 GitHub, Google, Steam" />
      </div>

      <div class="input-wrapper">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">账号标识 (Account)</label>
        <input type="text" id="addAccountInput" class="input-control" placeholder="如 user@example.com" />
      </div>

      <div class="input-wrapper">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">密钥 (Base32 Secret)</label>
        <input type="text" id="addSecretInput" class="input-control" placeholder="输入 Base32 密钥" style="font-family: var(--font-mono);" />
      </div>

      <div class="input-wrapper">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">验证算法 (Algorithm)</label>
        <select id="addAlgoSelect" class="input-control">
          <option value="SHA1">SHA1 (标准 6位数字)</option>
          <option value="SHA256">SHA256</option>
          <option value="SHA512">SHA512</option>
          <option value="STEAM">STEAM (Steam Guard 5位字符)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button id="cancelAddBtn" class="btn-ghost">取消</button>
        <button id="saveAccountBtn" class="btn-primary">保存账号</button>
      </div>
    </div>
  </div>

  <!-- Settings / Change Master Password Modal -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">修改主密码</h3>
        <button id="closeSettingsModalBtn" class="btn-icon-only" style="border: none; background: transparent;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="input-wrapper">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">当前主密码</label>
        <input type="password" id="currentPasswordInput" class="input-control" placeholder="输入当前主密码" />
      </div>

      <div class="input-wrapper">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">新主密码</label>
        <input type="password" id="newPasswordInput" class="input-control" placeholder="输入新主密码" />
      </div>

      <div class="input-wrapper">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">确认新主密码</label>
        <input type="password" id="confirmNewPasswordInput" class="input-control" placeholder="再次输入新主密码" />
      </div>

      <div id="settingsError" style="color: var(--destructive); margin-bottom: 1rem; font-size: 0.9rem; font-weight: 500; display: none;"></div>

      <div class="modal-actions">
        <button id="cancelSettingsBtn" class="btn-ghost">取消</button>
        <button id="updatePasswordBtn" class="btn-primary">确认更新密码</button>
      </div>
    </div>
  </div>

  <!-- Delete Account Confirmation Modal -->
  <div id="deleteConfirmModal" class="modal-backdrop">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <div style="width: 48px; height: 48px; background: rgba(239, 68, 68, 0.1); color: var(--destructive); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
      <h3 class="modal-title" style="margin-bottom: 0.5rem;">确认删除账号？</h3>
      <p id="deleteConfirmText" style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1.5rem;">确定要删除此验证码账号吗？删除后云端将同步更新，且不可撤销。</p>
      
      <div class="modal-actions" style="justify-content: center;">
        <button id="cancelDeleteBtn" class="btn-ghost">取消</button>
        <button id="confirmDeleteBtn" class="btn-primary" style="background: var(--destructive); border-color: var(--destructive);">确认删除</button>
      </div>
    </div>
  </div>

  <!-- Toast Banner -->
  <div id="toast" class="toast-banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastText">验证码已复制到剪贴板！</span>
  </div>

  <script type="module" src="./src/js/app.js?v=1.1.3"></script>
</body>
</html>
